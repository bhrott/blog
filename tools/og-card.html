<!doctype html>
<!--
  Source for the site-wide social share image (og:image / twitter:image).

  Lives outside src/ on purpose: anything under src/ is a Jekyll source file and
  would be published as a page. This is a build input, not a page.

  Regenerate src/assets/og-default.png with tools/build-og-card.sh. The palette
  below is copied from src/assets/main.scss — keep the two in step by hand.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Open Graph's recommended size. 1.91:1, which is what X, LinkedIn, Slack,
     Discord and iMessage all crop to. */
  :root {
    --bg:      #0b0e13;
    --surface: #131820;
    --border:  #232b36;
    --text:    #c9d1d9;
    --muted:   #7d8899;
    --primary: #57cc99;
    --accent:  #e1b07e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background-color: var(--bg);
    /* Same faint terminal grid the site draws on <html>. */
    background-image:
      linear-gradient(rgba(87, 204, 153, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(87, 204, 153, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--text);
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* The site header's 3px top rule, scaled up for a 1200px-wide canvas. */
  .frame {
    width: 100%;
    height: 100%;
    border-top: 8px solid var(--primary);
    padding: 84px 90px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .title {
    color: var(--primary);
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  /* Matches the ~/ prompt glyph on the site title. */
  .title .prompt { color: rgba(87, 204, 153, 0.45); }

  .tagline {
    margin-top: 34px;
    color: var(--text);
    font-size: 34px;
    line-height: 1.5;
    max-width: 900px;
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding-top: 30px;
    border-top: 1px solid var(--border);
  }

  .domain {
    color: var(--muted);
    font-size: 26px;
    letter-spacing: 0.04em;
  }

  .domain::before {
    content: "$ ";
    color: var(--accent);
  }

  /* Tag chips, same treatment as .post-tag on the site. */
  .tags { display: flex; gap: 14px; }

  .tag {
    background-color: rgba(225, 176, 126, 0.1);
    border: 1px solid rgba(225, 176, 126, 0.3);
    border-radius: 5px;
    color: var(--accent);
    font-size: 24px;
    letter-spacing: 0.04em;
    padding: 6px 14px;
  }

  .tag::before { content: "#"; color: rgba(225, 176, 126, 0.55); }
</style>
</head>
<body>
  <div class="frame">
    <div>
      <div class="title"><span class="prompt">~/</span>benhurott</div>
      <div class="tagline">
        Application security, offensive tooling, and building software with AI
        agents you can actually trust.
      </div>
    </div>

    <div class="foot">
      <span class="domain">benhurott.com</span>
      <div class="tags">
        <span class="tag">appsec</span>
        <span class="tag">red-team</span>
        <span class="tag">agents</span>
      </div>
    </div>
  </div>
</body>
</html>
