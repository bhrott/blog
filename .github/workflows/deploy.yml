name: GH Pages Deploy

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # The Jekyll site lives in src/, not at the repo root.
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # runs `bundle install` and caches the gems
          working-directory: src # where the Gemfile lives

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # url/baseurl come from _config.yml so the site always builds for
      # https://benhurott.com, not the *.github.io fallback domain.
      - name: Build site 🏗️
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src/_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
